<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>Yua Phone Simulator</title>
<style>
:root{
  --blue:#007aff; --bg:#f6f6f8; --line:#e5e5e7; --text:#111; --muted:#8e8e93;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;touch-action:manipulation;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Apple SD Gothic Neo","Noto Sans KR",sans-serif}
button,input{font:inherit}
button{cursor:pointer}
.phone{
  position:relative;width:min(430px,100vw);height:min(880px,100vh);margin:auto;
  overflow:hidden;background:#000;border-radius:42px;box-shadow:0 20px 70px #0008;
}
@media(max-width:500px){.phone{width:100vw;height:100dvh;min-height:100vh;border-radius:0;box-shadow:none}.status{padding-top:env(safe-area-inset-top);height:calc(45px + env(safe-area-inset-top))}.dock{bottom:calc(25px + env(safe-area-inset-bottom))}.home-indicator{bottom:calc(8px + env(safe-area-inset-bottom))}.app-home-indicator{bottom:calc(8px + env(safe-area-inset-bottom))}.inputbar{padding-bottom:calc(8px + env(safe-area-inset-bottom))}}
.wallpaper{position:absolute;inset:0;background:#222 center/cover no-repeat}
.wallpaper::after{content:"";position:absolute;inset:0;background:linear-gradient(#0001,#0002 50%,#0007)}
.lock{
  position:absolute;inset:0;z-index:100;color:white;text-align:center;
  background:#000 center/cover no-repeat;transition:.45s transform,.25s opacity;
}
.lock.hide{transform:translateY(-100%);opacity:0;pointer-events:none}
.lock-top{padding-top:70px;text-shadow:0 2px 12px #0008}
.lock-time{font-size:70px;line-height:1;font-weight:300;letter-spacing:-4px}
.lock-date{font-size:19px;margin-top:9px;font-weight:500}
.lock-lock{font-size:17px;margin-bottom:12px}
.pass-area{position:absolute;left:0;right:0;bottom:105px}
.pass-area p{font-size:13px;margin:0 0 10px;text-shadow:0 1px 5px #000}
.pass{width:175px;height:43px;border:1px solid #fffc;border-radius:22px;background:#0005;color:#fff;text-align:center;outline:none;letter-spacing:7px}
.pass::placeholder{letter-spacing:1px;color:#fff9}
.error{height:18px;font-size:12px;color:#ffd4d4;margin-top:7px}
.home-indicator{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:125px;height:5px;border-radius:5px;background:#fff;z-index:200}
.home{
 position:absolute;inset:0;color:#fff;overflow:hidden;
 background:center/cover no-repeat;
}
.home::after{content:"";position:absolute;inset:0;background:#0002;pointer-events:none}
.status{
 height:45px;display:flex;align-items:center;justify-content:space-between;padding:0 21px;
 font-size:13px;font-weight:700;position:relative;z-index:2;text-shadow:0 1px 4px #000;
}
.status-right{display:flex;gap:7px;align-items:center}
.grid{
 position:relative;z-index:2;padding:18px 18px 120px;display:grid;grid-template-columns:repeat(4,1fr);gap:21px 10px;
}
.app{text-align:center;color:#fff;font-size:11px;text-shadow:0 1px 4px #000;user-select:none}
.icon{
 width:59px !important;height:59px !important;min-width:59px;min-height:59px;border-radius:15px;margin:auto;display:flex;align-items:center;justify-content:center;flex:none;
 background:#fff;color:#222;font-size:27px;box-shadow:0 5px 15px #0004;position:relative;overflow:hidden
}
.icon.calendar{color:#e53935;font-weight:800}.icon.google{font-weight:900;color:#4285f4}
.icon.mail{color:#287cff}.icon.gallery{background:linear-gradient(135deg,#ffd2e1,#b8d8ff,#fff2a8)}
.icon.memo{background:#ffe76b}.icon.calc{background:#303030;color:#fff;font-size:27px;line-height:1}.icon.clock{background:#111;color:#fff}
.icon.todo{background:#fff}.icon.netflix{background:#050505;color:#e50914;font-weight:900;font-size:27px;line-height:1}
.icon.phone{background:#34c759;color:#fff}.icon.contact{background:#e9f2ff;color:#287cff}
.icon.instagram{background:linear-gradient(135deg,#833ab4,#fd1d1d,#fcb045);color:#fff}
.icon.kakao{background:#fee500}.icon.safari{background:#fff;color:#1683ff}.icon.sms{background:#34c759;color:#fff}
.label{margin-top:6px}
.dock{
 position:absolute;z-index:3;bottom:25px;left:12px;right:12px;height:86px;border-radius:27px;
 background:#ffffff2e;backdrop-filter:blur(22px);display:grid;grid-template-columns:repeat(4,1fr);align-items:center;padding:10px
}
.dock .icon{width:57px !important;height:57px !important;min-width:57px;min-height:57px}
.window{
 position:absolute;inset:0;z-index:20;background:var(--bg);color:var(--text);
 transform:translateX(100%);transition:transform .32s cubic-bezier(.22,.61,.36,1);display:flex;flex-direction:column
}
.window.open{transform:translateX(0)}
.header{
 height:92px;padding:43px 16px 9px;display:flex;align-items:center;gap:8px;
 background:#f8f8facc;backdrop-filter:blur(18px);border-bottom:1px solid var(--line);flex-shrink:0
}
.back{border:0;background:none;color:var(--blue);font-size:30px;padding:0 8px 0 0;line-height:1}
.title{font-size:20px;font-weight:750}
.content{flex:1;overflow-y:auto;overscroll-behavior:contain}
.content::-webkit-scrollbar{display:none}
.row{display:flex;align-items:center;min-height:70px;padding:10px 16px;background:#fff;border-bottom:1px solid #eee}
.row:active{background:#eee}
.avatar{width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,#ffd5e7,#bcd8ff);display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
.info{flex:1;min-width:0;margin-left:12px}.name{font-weight:650}.preview{font-size:12px;color:#8a8a8f;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:5px}.time{font-size:10px;color:#aaa}
.section{padding:16px 16px 8px;font-size:13px;color:#777;font-weight:700}
.empty{padding:50px 25px;text-align:center;color:#999}
.card{margin:12px;border-radius:15px;background:#fff;padding:15px;box-shadow:0 2px 10px #0000000d}
.btn{border:0;border-radius:12px;background:#007aff;color:#fff;padding:10px 14px}
.small{font-size:12px;color:#888}
.hr{height:1px;background:#eee;margin:10px 0}

/* Instagram */
.ig{background:#fff}
.ig-head{height:92px;padding:43px 15px 8px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #eee}
.ig-logo{font:700 25px cursive}.ig-actions{font-size:22px}
.stories{display:flex;gap:13px;padding:12px;overflow:auto;border-bottom:1px solid #eee}
.story{min-width:64px;text-align:center;font-size:10px}.storypic{width:58px;height:58px;border-radius:50%;padding:3px;background:linear-gradient(45deg,#f9ce34,#ee2a7b,#6228d7);margin:auto auto 4px}.storyinner{width:100%;height:100%;border-radius:50%;background:linear-gradient(135deg,#f2c6d8,#9ebeff);border:2px solid #fff}
.posthead{display:flex;align-items:center;gap:9px;padding:11px;font-size:13px;font-weight:700}.postimg{height:330px;background:linear-gradient(135deg,#f4d4df,#d5c8ff,#a8d5ff);display:flex;align-items:center;justify-content:center;font-size:48px}.postact{padding:10px 12px;font-size:23px}.caption{padding:0 12px 15px;font-size:13px}.igbar{position:sticky;bottom:0;height:61px;background:#fff;border-top:1px solid #ddd;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;text-align:center;font-size:22px}

/* Chat */
.chat-head{height:92px;padding:43px 15px 9px;display:flex;align-items:center;border-bottom:1px solid #ddd;background:#fff}.chat-head .back{margin-right:5px}
.messages{height:100%;overflow-y:auto;padding:15px 12px 80px;background:#b8d0e0}
.msg{display:flex;margin:7px 0}.msg.me{justify-content:flex-end}.bubble{max-width:76%;padding:9px 12px;border-radius:17px;background:#fff;font-size:14px;line-height:1.35}.me .bubble{background:#fee500}.msgtime{font-size:9px;color:#777;align-self:flex-end;margin:0 5px}.inputbar{position:absolute;bottom:0;left:0;right:0;padding:8px;background:#f5f5f7;border-top:1px solid #ddd;display:flex;gap:7px}.inputbar input{flex:1;border:1px solid #ddd;border-radius:20px;padding:9px 13px;outline:none}.send{border:0;border-radius:20px;background:#007aff;color:#fff;width:45px}

/* Phone */
.call-list .row{min-height:66px}.call-icon{width:39px;height:39px;border-radius:50%;background:#34c759;color:#fff;display:flex;align-items:center;justify-content:center}
.call-screen{position:absolute;inset:0;background:#101010;color:#fff;z-index:60;display:none;flex-direction:column;align-items:center;padding-top:115px;text-align:center}
.call-screen.show{display:flex}.call-avatar{width:105px;height:105px;border-radius:50%;background:linear-gradient(135deg,#ffd5e7,#bcd8ff);display:flex;align-items:center;justify-content:center;font-size:42px;margin-bottom:18px}.call-name{font-size:28px;font-weight:650}.call-sub{color:#aaa;margin-top:6px}.call-script{margin:42px 28px 0;min-height:120px;font-size:18px;line-height:1.65}.hang{margin-top:auto;margin-bottom:95px;width:62px;height:62px;border-radius:50%;border:0;background:#ff3b30;color:#fff;font-size:25px}

/* Calendar */
.cal-wrap{padding:12px;background:#fff}.cal-title{font-size:28px;font-weight:750;padding:5px}.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}.weekday{font-size:11px;color:#777;padding:8px 0}.day{min-height:55px;border-radius:9px;padding-top:6px;font-size:13px}.day.event{background:#fff0f0;color:#e53935;font-weight:700}.eventtxt{font-size:8px;margin-top:5px;white-space:nowrap;overflow:hidden}.sun{color:#e53935}.sat{color:#3478f6}

/* Safari */
.searchbox{margin:12px;border:1px solid #ddd;background:#fff;border-radius:12px;padding:11px 14px;color:#333}.history{background:#fff}.history .row{min-height:53px}.searchico{color:#888;margin-right:10px}

/* Contacts */
.favorite{background:#fff;padding:15px}.fav-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;text-align:center}.fav .avatar{width:53px;height:53px;margin:auto}.fav-name{font-size:11px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Notes / todo */
.note{margin:12px;padding:15px;border-radius:15px;background:#fff}.todo-line{display:flex;align-items:center;gap:10px;padding:14px 16px;background:#fff;border-bottom:1px solid #eee}.todo-box{width:21px;height:21px;border:1.5px solid #aaa;border-radius:50%}

/* calculator */
.calc{padding:18px;background:#111;height:100%;display:flex;flex-direction:column}.calc-display{height:115px;color:#fff;font-size:48px;text-align:right;padding:30px 10px 10px;overflow:hidden}.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:auto}.calc-grid button{height:67px;border:0;border-radius:50%;font-size:23px;background:#333;color:#fff}.calc-grid button.op{background:#ff9f0a}.calc-grid button.gray{background:#a5a5a5;color:#111}.calc-grid button.zero{grid-column:span 2;border-radius:34px;text-align:left;padding-left:25px}

/* Gallery */
.gallery-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}.gallery-cell{aspect-ratio:1;background:linear-gradient(135deg,#f6d1dc,#b9d2ff,#ffe6a7);display:flex;align-items:center;justify-content:center;font-size:30px}.gallery-note{padding:16px;background:#fff;color:#888;font-size:13px}

/* mail / google / netflix / clock */
.simple-center{padding:45px 25px;text-align:center}.mail-card{margin:10px 12px;background:#fff;border-radius:15px;padding:15px}.netflix{background:#050505;color:#fff;min-height:100%;padding:20px}.nlogo{color:#e50914;font-size:35px;font-weight:900;padding:20px 0}.movie{height:170px;border-radius:8px;background:linear-gradient(135deg,#151515,#4a1c28);margin:10px 0;padding:15px;display:flex;align-items:flex-end;font-weight:700}.clock-big{text-align:center;font-size:54px;padding:45px 0 25px}.google-page{background:#fff;min-height:100%;padding:70px 20px}.google-logo{text-align:center;font-size:48px;font-weight:800;color:#4285f4}.google-search{margin:30px auto;border:1px solid #ddd;border-radius:30px;padding:13px 18px;max-width:340px;color:#777}

/* toast */
.toast{position:absolute;z-index:999;left:50%;bottom:75px;transform:translateX(-50%) translateY(20px);background:#222e;color:#fff;padding:10px 15px;border-radius:15px;font-size:12px;opacity:0;pointer-events:none;transition:.25s}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.disabled-app{opacity:.62;cursor:not-allowed}
.icon{width:59px!important;height:59px!important;min-width:59px;min-height:59px;flex:none}
.icon.calc{background:#202020!important;color:#fff!important;border:1px solid #555;font-size:20px!important}
.icon.netflix{font-size:25px!important;line-height:1}
.app-home-indicator{position:absolute;z-index:80;left:50%;bottom:8px;transform:translateX(-50%);width:125px;height:5px;border-radius:6px;background:#1118;pointer-events:none}
.window.dark .app-home-indicator{background:#fff}
.ig-profile{background:#fff;padding:14px 15px 10px;border-bottom:1px solid #eee}.ig-profile-top{display:flex;gap:15px;align-items:center}.ig-profile-pic{width:82px;height:82px;border-radius:50%;background:linear-gradient(135deg,#f7c6df,#9fc8ff);border:1px solid #ddd}.ig-profile-name{font-weight:750;font-size:16px}.ig-stats{display:flex;gap:18px;margin-top:8px;font-size:12px}.ig-bio{margin-top:12px;font-size:12px;line-height:1.5}.ig-tabs{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;border-top:1px solid #eee;margin-top:12px;padding-top:10px}.todo-add{padding:14px;background:#fff;border-bottom:1px solid #eee;display:flex;gap:8px}.todo-add input{flex:1;border:1px solid #ddd;border-radius:10px;padding:10px;outline:none}.unread-badge{background:#ff3b30;color:#fff;min-width:20px;height:20px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:11px;padding:0 5px}.ig-dm-list{background:#fff}.ig-dm-head{padding:14px 16px;font-weight:750;font-size:18px;border-bottom:1px solid #eee}.ig-dm-row{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid #eee;gap:12px}.ig-dm-avatar{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#ffd5e7,#bcd8ff);display:flex;align-items:center;justify-content:center;font-weight:700}.ig-dm-text{flex:1;min-width:0}.ig-dm-name{font-weight:650}.ig-dm-preview{font-size:12px;color:#888;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ig-bottom-btn{border:0;background:none;font-size:22px;padding:0;display:flex;align-items:center;justify-content:center}
</head>
<body>
<div class="phone" id="phone">
  <div class="wallpaper" id="wallpaper"></div>

  <div class="lock" id="lock">
    <div class="lock-top">
      <div class="lock-lock">🔒</div>
      <div class="lock-time">11:26</div>
      <div class="lock-date">8월 24일 월요일</div>
    </div>
    <div class="pass-area">
      <p>암호를 입력하세요</p>
      <input class="pass" id="pass" type="password" inputmode="numeric" maxlength="4" placeholder="암호">
      <div class="error" id="passError"></div>
    </div>
    <div class="home-indicator"></div>
  </div>

  <main class="home" id="home">
    <div class="status"><span>11:26</span><span class="status-right"><span>▮▮▮</span><span>◉</span><span>▰</span></span></div>
    <div class="grid">
      <div class="app" onclick="openApp('calendar')"><div class="icon calendar">24</div><div class="label">캘린더</div></div>
      <div class="app" onclick="openApp('google')"><div class="icon google">G</div><div class="label">Google</div></div>
      <div class="app disabled-app"><div class="icon mail">✉</div><div class="label">메일</div></div>
      <div class="app" onclick="openApp('gallery')"><div class="icon gallery">🌄</div><div class="label">갤러리</div></div>
      <div class="app" onclick="openApp('memo')"><div class="icon memo">📝</div><div class="label">메모</div></div>
      <div class="app" onclick="openApp('calculator')"><div class="icon calc">＋</div><div class="label">계산기</div></div>
      <div class="app disabled-app"><div class="icon clock">◷</div><div class="label">시계</div></div>
      <div class="app" onclick="openApp('todo')"><div class="icon todo">✓</div><div class="label">할 일 목록</div></div>
      <div class="app disabled-app"><div class="icon netflix">N</div><div class="label">Netflix</div></div>
      <div class="app" onclick="openApp('phone')"><div class="icon phone">☎</div><div class="label">전화</div></div>
      <div class="app" onclick="openApp('contacts')"><div class="icon contact">●</div><div class="label">연락처</div></div>
    </div>
    <div class="dock">
      <div class="app" onclick="openApp('instagram')"><div class="icon instagram">◎</div></div>
      <div class="app" onclick="openApp('kakao')"><div class="icon kakao">●</div></div>
      <div class="app" onclick="openApp('safari')"><div class="icon safari">🧭</div></div>
      <div class="app" onclick="openApp('sms')"><div class="icon sms">●</div></div>
    </div>
    <div class="home-indicator"></div>
  </main>

  <section class="window" id="app-calendar"></section>
  <section class="window" id="app-google"></section>
  <section class="window" id="app-mail"></section>
  <section class="window" id="app-gallery"></section>
  <section class="window" id="app-memo"></section>
  <section class="window" id="app-calculator"></section>
  <section class="window" id="app-clock"></section>
  <section class="window" id="app-todo"></section>
  <section class="window" id="app-netflix"></section>
  <section class="window" id="app-phone"></section>
  <section class="window" id="app-contacts"></section>
  <section class="window" id="app-instagram"></section>
  <section class="window" id="app-kakao"></section>
  <section class="window" id="app-safari"></section>
  <section class="window" id="app-sms"></section>

  <div class="call-screen" id="callScreen">
    <div class="call-avatar" id="callAvatar">♥</div>
    <div class="call-name" id="callName"></div>
    <div class="call-sub">통화 중</div>
    <div class="call-script" id="callScript"></div>
    <button class="hang" onclick="endCall()">☎</button>
  </div>
  <div class="toast" id="toast"></div>
</div>

<script>
/* =========================================================
   여기부터는 나중에 내용을 바꾸기 쉽게 데이터로 분리해 둠
========================================================= */

const callData = {
  "우엉이":["어 유아야~","나 이제 집 가는 중!","나 보고싶지?","오늘 좀 힘들었어..ㅠㅠ","그래도 너 볼 생각하니까 힘 난다!","맛있는거 사갈게~","사랑해~"],
  "경미니":["누나 저번에 말한거 샀어?","형 생일에 뭐할거야?","알았어","끊어줘 누나가"],
  "혜인이":["언니 어디예요?","언니 저 늦을 것 같다고 좀 전해주세요","저 버스가 늦게와서 늦을 것 같아요","아 언니 그리고 저 저번에 알려주신 수행평가 만점이에요!","아니에요~ 끊을게요"],
  "지아언니":["유아야 도착했어?","언니 엘리베이턴데 배고파 지금?","배고프면 빨리 뭐 먹고오려 그랬지","아니야 언니는 괜찮아~","알았어 끊어~"],
  "매니저언니":["유아야 언니 지금 도착했는데","아 저번에 고마워~","아니야 괜히 힘들게해서 언니가 미안하지","대신 너 좋아하는 초코파이 사왔어","알겠어 얼른 내려와~"],
  "엄마":["유아야 승연이 연락 돼?","아니 얘는 전화를 왜 안받아","알았어 오늘도 화이팅!","엄마가 많이 사랑해~","끊어~ 우리 예쁜 딸내미"],
  "은경엄마":["어 여보세요? 저번에 보내준 총각김치 먹었어?","맛있었다니 다행이다","에이 뭘~ 엄마가 나중에 또 보내줄게","어 알았어~ 끊어~"]
};

function header(title, id){
 return `<div class="header"><button class="back" onclick="closeApp('${id}')">‹</button><div class="title">${title}</div></div>`;
}

function openApp(id){
 const el=document.getElementById("app-"+id);
 if(!el)return;
 renderApp(id);
 el.classList.add("open");
 requestAnimationFrame(()=>el.querySelector(".content")?.scrollTo(0,0));
}

function closeApp(id){
 document.getElementById("app-"+id)?.classList.remove("open");
}

function renderApp(id){
 const el=document.getElementById("app-"+id);
 const c=el.querySelector(".content");
 if(id==="instagram") renderInstagram(el);
 else if(id==="kakao") renderKakao(el);
 else if(id==="sms") renderSMS(el);
 else if(id==="phone") renderPhone(el);
 else if(id==="contacts") renderContacts(el);
 else if(id==="calendar") renderCalendar(el);
 else if(id==="safari") renderSafari(el);
 else if(id==="memo") renderMemo(el);
 else if(id==="todo") renderTodo(el);
 else if(id==="gallery") renderGallery(el);
 else if(id==="calculator") renderCalculator(el);
 else if(id==="clock") renderClock(el);
 else if(id==="mail") renderMail(el);
 else if(id==="google") renderGoogle(el);
 else if(id==="netflix") renderNetflix(el);
 if(el.querySelector(".content")) el.querySelector(".content").scrollTop=0;
}

function openChat(type, encoded){
 const name=decodeURIComponent(encoded);
 const el=document.createElement("div");
 el.className="window open";
 el.style.zIndex=40;
 el.id="tempChat";
 const messages=name==="우엉이"
 ? ["유아야 뭐해?","나 지금 집 가는 중이야 ㅋㅋ","오늘은 뭐했어?","보고싶은데? 🥹"]
 : ["대화 내용은 추후 변경 예정이에요."];
 el.innerHTML=`
  <div class="chat-head"><button class="back" onclick="this.closest('.window').remove()">‹</button><div class="title">${name}</div></div>
  <div class="content messages" id="chatMessages">
   ${messages.map((m,i)=>`<div class="msg ${i%2?"me":""}"><div class="bubble">${m}</div><span class="msgtime">11:${20+i}</span></div>`).join("")}
  </div>
  <div class="inputbar"><input id="chatInput" placeholder="메시지 입력"><button class="send" onclick="sendChat('${name}')">↑</button></div>`;
 document.getElementById("phone").appendChild(el);
 el.querySelector(".messages").scrollTop=0;
}

function sendChat(name){
 const input=document.getElementById("chatInput"), text=input.value.trim();
 if(!text)return;
 const box=document.getElementById("chatMessages");
 box.insertAdjacentHTML("beforeend",`<div class="msg me"><div class="bubble">${escapeHTML(text)}</div><span class="msgtime">지금</span></div>`);
 input.value="";
 box.scrollTop=box.scrollHeight;
 if(name==="우엉이"){
   setTimeout(()=>aiReply(text),550);
 }
}

/* 우엉이 전용 대화형 응답 — 나중에 실제 AI API로 교체 가능 */
function aiReply(text){
 let reply="ㅋㅋ 뭐야 갑자기 😆 나도 보고싶지.";
 if(/보고싶|그리워/.test(text)) reply="나도 보고싶어 ㅋㅋ 왜 이렇게 귀엽게 말해";
 else if(/사랑|좋아/.test(text)) reply="나도 사랑하지~ 괜히 물어봐 😌";
 else if(/뭐해|뭐 하고/.test(text)) reply="나? 지금 집 가는 중! 너는 뭐해?";
 else if(/힘들|힘들어/.test(text)) reply="왜 힘들어 ㅠㅠ 내가 맛있는 거 사갈까?";
 else if(/밥|먹/.test(text)) reply="밥은 먹었어? 안 먹었으면 뭐라도 꼭 먹어.";
 else if(/생일/.test(text)) reply="ㅋㅋㅋ 또 뭐 준비하는데? 수상한데?";
 const box=document.getElementById("chatMessages");
 if(!box)return;
 box.insertAdjacentHTML("beforeend",`<div class="msg"><div class="bubble">${reply}</div><span class="msgtime">지금</span></div>`);
 box.scrollTop=box.scrollHeight;
}

function renderPhone(el){
 const rows=recentCalls.map((name,i)=>{
  const h=(7+(i*3)%15).toString().padStart(2,"0");
  const m=(3+i*7)%60;
  return `<div class="row" onclick="startCall('${name}')"><div class="call-icon">☎</div><div class="info"><div class="name">${name}</div><div class="preview">최근 통화</div></div><div class="time">${h}:${String(m).padStart(2,"0")}</div></div>`;
 }).join("");
 el.className="window open";
 el.innerHTML=`${header("전화","phone")}<div class="content call-list"><div class="section">최근 통화</div>${rows}</div>`;
}
function startCall(name){
 const screen=document.getElementById("callScreen");
 document.getElementById("callName").textContent=name;
 document.getElementById("callAvatar").textContent=name==="우엉이"?"♥":"●";
 const scripts=callData[name]||["안녕하세요.","통화 내용을 추후 추가할 수 있어요."];
 let i=0;
 document.getElementById("callScript").textContent=scripts[0];
 screen.classList.add("show");
 if(window.callTimer)clearInterval(window.callTimer);
 window.callTimer=setInterval(()=>{
  i++;
  if(i<scripts.length)document.getElementById("callScript").textContent=scripts[i];
  else clearInterval(window.callTimer);
 },1300);
}
function endCall(){document.getElementById("callScreen").classList.remove("show");if(window.callTimer)clearInterval(window.callTimer)}

openChat=function(type,enc){const name=decodeURIComponent(enc);if(type!=='kakao'||name!=='우엉이'){showToast('이 채팅방은 아직 열 수 없어요.');return}const key='yua_wooyoung_chat';const msgs=JSON.parse(localStorage.getItem(key)||'null')||[{me:false,text:'유아야 뭐해?'},{me:false,text:'나 지금 집 가는 중이야 ㅋㅋ'},{me:false,text:'오늘은 뭐했어?'},{me:false,text:'보고싶은데? 🥹'}];const el=document.createElement('div');el.className='window open';el.style.zIndex=40;el.id='tempChat';el.innerHTML=`<div class="chat-head"><button class="back" onclick="this.closest('.window').remove()">‹</button><div class="title">우엉이</div></div><div class="content messages" id="chatMessages">${msgs.map(m=>`<div class="msg ${m.me?'me':''}"><div class="bubble">${escapeHTML(m.text)}</div><span class="msgtime">${m.me?'지금':''}</span></div>`).join('')}</div><div class="inputbar"><input id="chatInput" placeholder="메시지 입력"><button class="send" onclick="sendCustomChat()">↑</button></div>`;document.getElementById('phone').appendChild(el);el.querySelector('.messages').scrollTop=el.querySelector('.messages').scrollHeight;addIndicator(el)};
function sendCustomChat(){const input=document.getElementById('chatInput'),t=input.value.trim();if(!t)return;const key='yua_wooyoung_chat',a=JSON.parse(localStorage.getItem(key)||'[]');a.push({me:true,text:t});localStorage.setItem(key,JSON.stringify(a));const box=document.getElementById('chatMessages');box.insertAdjacentHTML('beforeend',`<div class="msg me"><div class="bubble">${escapeHTML(t)}</div><span class="msgtime">지금</span></div>`);input.value='';box.scrollTop=box.scrollHeight;setTimeout(()=>customAiReply(t),700)}
function customAiReply(t){let r='ㅋㅋ 뭐야 갑자기. 나도 보고싶지.';if(/보고싶|그리워/.test(t))r='나도 보고싶어 ㅋㅋ 왜 이렇게 귀엽게 말해';else if(/사랑|좋아/.test(t))r='나도 사랑하지~ 괜히 물어봐';else if(/뭐해/.test(t))r='나? 지금 집 가는 중이야 ㅋㅋ 너는?';else if(/힘들/.test(t))r='왜 힘들어 ㅠㅠ 오늘은 좀 쉬어';else if(/밥|먹/.test(t))r='밥은 먹었어? 안 먹었으면 뭐라도 먹어';else if(/생일/.test(t))r='ㅋㅋ 또 뭐 준비하는데? 수상한데';const a=JSON.parse(localStorage.getItem('yua_wooyoung_chat')||'[]');a.push({me:false,text:r});localStorage.setItem('yua_wooyoung_chat',JSON.stringify(a));const box=document.getElementById('chatMessages');if(!box)return;box.insertAdjacentHTML('beforeend',`<div class="msg"><div class="bubble">${r}</div><span class="msgtime">지금</span></div>`);box.scrollTop=box.scrollHeight}

   };

// Calculator also gets the universal home indicator after its innerHTML is rebuilt.
  const oldCalc=window.renderCalculator;
  window.renderCalculator=function(el){oldCalc(el);addIndicator(el)};

  // Refresh indicator on all existing windows after all overrides.
  document.querySelectorAll('.window').forEach(addIndicator);
